name: Release desktop

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME non coerente con apps/desktop/package.json ($expected)"
            exit 1
          fi

      - name: Lint, typecheck and tests
        run: npm run verify

  build:
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          # macos-13 (Intel) è stato ritirato da GitHub Actions: la label non esiste più
          # e il job resterebbe in coda per sempre. Il DMG Intel si cross-compila
          # sull'arm64 passando --x64 a electron-builder.
          - os: macos-14
            arch: x64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web standalone
        run: npm run web:build

      - name: Package desktop
        shell: bash
        working-directory: apps/desktop
        run: |
          npm run bundle:server
          # GitHub sostituisce i secret non configurati con stringhe vuote. Se restano
          # in env, electron-builder le interpreta come percorsi di certificato e fallisce
          # con "not a file". Le rimuoviamo se vuote prima di impacchettare.
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then unset "$var"; fi
          done
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "${CSC_LINK:-}" ] && [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            npx electron-builder --${{ matrix.arch }} --config.mac.notarize=true --publish never
          else
            # --${{ matrix.arch }}: su macos-14 si costruiscono sia arm64 sia x64 (cross-arch);
            # --publish never: la release la crea il job dedicato, non electron-builder
            npx electron-builder --${{ matrix.arch }} --publish never
          fi
        env:
          # Firma macOS (Developer ID). Se assenti, la build resta non firmata.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # Notarizzazione macOS (Apple ID con app-specific password).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Firma Windows (certificato Authenticode).
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGNING_CONFIGURED: ${{ secrets.MAC_CSC_LINK }}
          NOTARIZATION_CONFIGURED: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$SIGNING_CONFIGURED" ]; then
            codesign --verify --deep --strict --verbose=2 release/mac-*/Fantasta.app
          fi
          if [ -n "$NOTARIZATION_CONFIGURED" ]; then
            spctl --assess --type execute --verbose=2 release/mac-*/Fantasta.app
          fi

      - name: Verify Windows signature
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ secrets.WIN_CSC_LINK }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CONFIGURED)) {
            $signature = Get-AuthenticodeSignature "release/Fantasta-${{ matrix.arch }}.exe"
            if ($signature.Status -ne "Valid") {
              Write-Error "Firma Authenticode non valida: $($signature.StatusMessage)"
              exit 1
            }
          }

      - name: Upload artifacts (run manuali)
        uses: actions/upload-artifact@v6
        with:
          name: fantasta-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Fantasta ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/SHA256SUMS.txt
